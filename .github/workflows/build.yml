name: Android Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. استدعاء الكود الخاص بك من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. استدعاء بيئة جافا وتثبيت الـ JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. تحميل وتوليد الـ Gradle Wrapper تلقائياً داخل السيرفر
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    # 4. بناء التطبيق وتوليد ملف الـ APK
    - name: Build Debug APK
      run: gradle assembleDebug

    # 5. التعديل هنا: رفع الملف باستخدام خاصية البحث الذكي عن أي ملف ينتهي بـ .apk
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoxyMacScan-Debug-APK
        path: app/build/outputs/apk/**/*.apk
