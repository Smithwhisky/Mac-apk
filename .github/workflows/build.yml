# اسم العملية الظاهر في حسابك على GitHub
name: Android Build APK

# متى يتم تشغيل هذا السكربت؟ (عند عمل Push أو رفع كود على فرع main)
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # تحديد نظام التشغيل المستضاف في خوادم جيتهاب (Ubuntu هو الأسرع والأخف)
    runs-on: ubuntu-latest

    steps:
    # 1. استدعاء الكود الخاص بك من المستودع (Repository)
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. استدعاء بيئة جافا وتثبيت الـ JDK (الذي رأيته في الفيديو)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin' # نسخة مستقرة ومدعومة وموصى بها للأندرويد الحديث
        cache: gradle # تفعيل الكاش لتسريع عمليات البناء القادمة

    # 3. إعطاء صلاحية التنفيذ لملف محرك بناء الأندرويد (Gradle Wrapper)
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # 4. بناء التطبيق وتوليد ملف الـ APK (بديل لزر Build في الـ Android Studio)
    - name: Build Debug APK
      run: ./gradlew assembleDebug

    # 5. رفع الملف الناتج (APK) لكي تتمكن من تحميله من موقع GitHub مباشرة
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoxyMacScan-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
