name: Android Build APK

on:
  push:
    branches: [ "main", "master" ] # سيعمل على كلا الفرعين لضمان التشغيل
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. استدعاء الكود الخاص بك من المستودع
    - name: Checkout the code
      uses: actions/checkout@v4

    # 2. استدعاء بيئة جافا وتثبيت الـ JDK 17
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # 3. خطوة سحرية: توليد ملفات الـ Gradle Wrapper المفقودة تلقائياً داخل السيرفر
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5 # سيقوم بتحميل وتوليد ملف gradlew متوافق تلقائياً

    # 4. بناء التطبيق وتوليد ملف الـ APK باستخدام الأمر المباشر بعد توليد البيئة
    - name: Build Debug APK
      run: gradle assembleDebug

    # 5. رفع الملف الناتج (APK) لتحميله
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FoxyMacScan-Debug-APK
        path: app/build/outputs/apk/debug/app-debug.apk
